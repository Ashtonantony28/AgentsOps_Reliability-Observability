name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: pytest tests/policy/test_differential.py -q --hypothesis-profile=ci
      - run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head
      - name: bench (dry run)
        run: python backend/scripts/bench_policy.py --dry-run
        working-directory: .
      - name: bench (batch budget)
        run: python backend/scripts/bench_policy.py --path batch --assert-budget
        working-directory: .
      - name: bench (counterexample budget)
        run: python backend/scripts/bench_policy.py --path counterexample --assert-budget
        working-directory: .
      - name: bench (live and ingest budgets)
        run: |
          python backend/scripts/bench_policy.py --path live --assert-budget
          python backend/scripts/bench_policy.py --path ingest --assert-budget
          python backend/scripts/bench_policy.py --load 500 --seconds 60
        working-directory: .

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e sdk pytest
      - run: cd sdk && pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test -- --run
